<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced To-Do List</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Advanced To-Do List</h1>
      <p>Created by Dieume Willstein</p>
    </header>

    <section id="task-input-section">
      <input type="text" id="task-input" placeholder="Add a new task..." />
      <input type="date" id="due-date" />
      <select id="priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="text" id="category" placeholder="Category (optional)" />
      <button id="add-task">Add Task</button>
    </section>

    <section id="filters">
      <input type="text" id="search" placeholder="Search tasks..." />
      <select id="filter-priority">
        <option value="all">All Priorities</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </section>

    <section id="task-list"></section>

    <footer>
      <button id="export-tasks">Export Tasks</button>
      <input type="file" id="import-tasks" />

      <hr />

      <p><strong>Developer:</strong> Dieume Willstein</p>
      <p><strong>Email:</strong> <a href="mailto:dieumewillstein@gmail.com">dieumewillstein@gmail.com</a></p>
      <p>&copy; 2025 Dieume Willstein. All rights reserved.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
